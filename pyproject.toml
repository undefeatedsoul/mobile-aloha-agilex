[project]
name = "mobile-aloha-agilex"
version = "0.1.0"
description = "Synchronous remote pi inference client for an AgileX dual-arm robot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpi-client==0.1.0",
    "numpy==1.24.4",
    "pillow==10.4.0",
    "einops==0.8.0",
    "dm-env==1.6",
    "opencv-python==4.10.0.84",
    "matplotlib==3.7.5",
    "rospkg==1.5.1",
    "pyyaml==6.0.2",
    "tyro==0.9.2",
    "typing-extensions==4.12.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
agilex-infer = "mobile_aloha_agilex.main:cli"

[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mobile_aloha_agilex", "mobile_aloha_agilex.monitor"]
package-dir = { mobile_aloha_agilex = "." }
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests", "packages/openpi-client/src/openpi_client"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
